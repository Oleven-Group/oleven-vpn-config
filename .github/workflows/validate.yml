name: Validate config
on:
  push:
    paths: [ "config.json", "tools/validate-config.sh", ".github/workflows/validate.yml" ]
  pull_request:
  workflow_dispatch:

# Questo config viene servito a TUTTI i client (il config remoto vince sul bundled):
# se viene pubblicato rotto, la VPN smette di partire ovunque. Il gate deve quindi
# provare l'AVVIO REALE di ogni modo, non solo la validita' dello schema.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download sing-box (STESSO motore dei client)
        # DEVE essere il fork shtorm-7/sing-box-extended alla versione pinnata negli script
        # di build di Android e iOS (scripts/build-libbox*.sh): il config di produzione usa
        # costrutti che l'upstream piu' recente rifiuta (es. un server DNS con detour verso
        # 'direct'), mentre il motore realmente in esecuzione sui client li accetta.
        # Validare con un motore diverso produce falsi allarmi e, peggio, falsi OK.
        run: |
          set -e
          V=1.12.22-extended-1.6.0
          curl -fsSL -o sb.tgz "https://github.com/shtorm-7/sing-box-extended/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz"
          tar xzf sb.tgz
          echo "SB=$PWD/sing-box-${V}-linux-amd64/sing-box" >> "$GITHUB_ENV"

      - name: Validate every selectable mode (real start + product invariants)
        run: |
          chmod +x tools/validate-config.sh
          ./tools/validate-config.sh config.json

      - name: Self-test del gate (deve FALLIRE su un config rotto)
        # Un gate che non fallisce mai e' inutile: qui iniettiamo il difetto che ha gia'
        # causato un rischio reale (riferimento a un outbound inesistente: passa `check`,
        # FATAL a `run`) e pretendiamo che il gate lo intercetti.
        run: |
          set -e
          python3 - <<'PY'
          import json
          c=json.load(open('config.json',encoding='utf-8'))
          for o in c['outbounds']:
              if o.get('tag')=='auto':
                  o['outbounds'].append('outbound-inesistente')
          json.dump(c, open('/tmp/broken.json','w',encoding='utf-8'))
          PY
          if ./tools/validate-config.sh /tmp/broken.json; then
            echo "::error::Il gate NON ha rilevato un config rotto: la validazione non protegge nulla."
            exit 1
          fi
          echo "Self-test OK: il gate rileva i config rotti."
